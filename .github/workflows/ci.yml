name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      # `verify` ejecuta Surefire (arranque de contexto, sin base) y Failsafe
      # (`*IT`, mapeo JPA y migraciones Flyway contra un MySQL real levantado por
      # Testcontainers). Los runners de GitHub ya traen Docker: no hace falta un
      # servicio `mysql:` en el job.
      - name: Verify reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publicar informes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/'
          if-no-files-found: ignore
          retention-days: 7
