spring.application.name=msvc-unidades
server.port=${UNIDADES_PORT:8040}
server.shutdown=graceful

spring.datasource.url=${UNIDADES_DB_URL:jdbc:mysql://localhost:3307/mirador_unidades?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${UNIDADES_DB_USER:mirador_unidades}
spring.datasource.password=${UNIDADES_DB_PASSWORD:unidades_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true

info.app.name=msvc-unidades
info.app.context=Gestión de Unidades
