spring.application.name=msvc-unidades
server.port=${UNIDADES_PORT:8040}
server.shutdown=graceful

spring.datasource.url=${UNIDADES_DB_URL:jdbc:mysql://localhost:3307/mirador_unidades?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${UNIDADES_DB_USER:mirador_unidades}
spring.datasource.password=${UNIDADES_DB_PASSWORD:unidades_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=msvc-unidades
info.app.context=Gestión de Unidades
