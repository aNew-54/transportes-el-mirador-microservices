spring.application.name=msvc-ejecucion
server.port=${EJECUCION_PORT:8030}
server.shutdown=graceful

spring.datasource.url=${EJECUCION_DB_URL:jdbc:mysql://localhost:3307/mirador_ejecucion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${EJECUCION_DB_USER:mirador_ejecucion}
spring.datasource.password=${EJECUCION_DB_PASSWORD:ejecucion_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mvc.problemdetails.enabled=true

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}

clients.programacion.url=${PROGRAMACION_URL:http://localhost:8020}
clients.unidades.url=${UNIDADES_URL:http://localhost:8040}
clients.conductores.url=${CONDUCTORES_URL:http://localhost:8050}
clients.comercial.url=${COMERCIAL_URL:http://localhost:8010}
clients.facturacion.url=${FACTURACION_URL:http://localhost:8060}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true

info.app.name=msvc-ejecucion
info.app.context=Ejecución y Seguimiento
