spring.application.name=msvc-programacion
server.port=${PROGRAMACION_PORT:8020}
server.shutdown=graceful

spring.datasource.url=${PROGRAMACION_DB_URL:jdbc:mysql://localhost:3307/mirador_programacion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PROGRAMACION_DB_USER:mirador_programacion}
spring.datasource.password=${PROGRAMACION_DB_PASSWORD:programacion_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mvc.problemdetails.enabled=true

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}

clients.comercial.url=${COMERCIAL_URL:http://localhost:8010}
clients.unidades.url=${UNIDADES_URL:http://localhost:8040}
clients.conductores.url=${CONDUCTORES_URL:http://localhost:8050}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true

info.app.name=msvc-programacion
info.app.context=Programación y Despacho
