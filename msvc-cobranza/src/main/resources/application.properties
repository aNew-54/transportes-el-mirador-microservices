spring.application.name=msvc-cobranza
server.port=${COBRANZA_PORT:8070}
server.shutdown=graceful

spring.datasource.url=${COBRANZA_DB_URL:jdbc:mysql://localhost:3307/mirador_cobranza?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${COBRANZA_DB_USER:mirador_cobranza}
spring.datasource.password=${COBRANZA_DB_PASSWORD:cobranza_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=msvc-cobranza
info.app.context=Cobranza
