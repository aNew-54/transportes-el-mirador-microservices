spring.application.name=msvc-comercial
server.port=${COMERCIAL_PORT:8010}
server.shutdown=graceful

spring.datasource.url=${COMERCIAL_DB_URL:jdbc:mysql://localhost:3307/mirador_comercial?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${COMERCIAL_DB_USER:mirador_comercial}
spring.datasource.password=${COMERCIAL_DB_PASSWORD:comercial_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mvc.problemdetails.enabled=true

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}

clients.cobranza.url=${COBRANZA_URL:http://localhost:8070}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true

info.app.name=msvc-comercial
info.app.context=Gestión Comercial
