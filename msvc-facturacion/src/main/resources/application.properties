spring.application.name=msvc-facturacion
server.port=${FACTURACION_PORT:8060}
server.shutdown=graceful

spring.datasource.url=${FACTURACION_DB_URL:jdbc:mysql://localhost:3307/mirador_facturacion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${FACTURACION_DB_USER:mirador_facturacion}
spring.datasource.password=${FACTURACION_DB_PASSWORD:facturacion_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}

clients.comercial.url=${COMERCIAL_URL:http://localhost:8010}
clients.cobranza.url=${COBRANZA_URL:http://localhost:8070}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=msvc-facturacion
info.app.context=Facturación
